name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        id: images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ENV: ${{ github.event.inputs.environment || 'dev' }}
        run: |
          API_REPO="${REGISTRY}/tap-rag-platform-${ENV}/api"
          UI_REPO="${REGISTRY}/tap-rag-platform-${ENV}/ui"
          docker build --target api -t "${API_REPO}:${GITHUB_SHA}" -t "${API_REPO}:latest" .
          docker build --target ui -t "${UI_REPO}:${GITHUB_SHA}" -t "${UI_REPO}:latest" .
          docker push "${API_REPO}:${GITHUB_SHA}"
          docker push "${API_REPO}:latest"
          docker push "${UI_REPO}:${GITHUB_SHA}"
          docker push "${UI_REPO}:latest"
          echo "api_image=${API_REPO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Install kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Stamp Kubernetes image
        env:
          API_IMAGE: ${{ steps.images.outputs.api_image }}
        run: |
          cd k8s
          kustomize edit set image "tap-rag-api=${API_IMAGE}"
          kustomize build . > /tmp/tap-rag-k8s.yaml
          echo "Wrote stamped manifest (apply on EKS with kubectl apply -f)"

      - name: Sync Chroma artifacts to S3
        env:
          BUCKET: ${{ secrets.S3_ARTIFACTS_BUCKET }}
        run: |
          if [ -z "$BUCKET" ]; then
            echo "S3_ARTIFACTS_BUCKET secret is required" >&2
            exit 1
          fi
          if [ -d chroma-db ]; then
            aws s3 sync chroma-db "s3://${BUCKET}/chroma/" --delete
          else
            echo "No local chroma-db; tasks will ingest or pull an existing snapshot"
          fi

      - name: Force ECS deployment
        env:
          ENV: ${{ github.event.inputs.environment || 'dev' }}
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_API_SERVICE }}
        run: |
          CLUSTER="${CLUSTER:-tap-rag-platform-${ENV}}"
          SERVICE="${SERVICE:-tap-rag-platform-${ENV}-api}"
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment
