name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Unit tests
        env:
          USE_MOCK_LLM: "true"
          USE_MOCK_EMBEDDINGS: "true"
        run: pytest tests/unit -q --cov=tap_rag --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  golden-eval:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Ingest + golden RAG eval (On-Demand Evaluation)
        env:
          USE_MOCK_LLM: "true"
          USE_MOCK_EMBEDDINGS: "true"
          DOCS_DIR: ./data/docs
          CHROMA_PERSIST_DIR: ./chroma-db
        run: |
          python -m tap_rag.rag.ingest
          python -m tap_rag.eval.runner

      - name: LoRA rule-based eval on training split
        env:
          USE_MOCK_LLM: "true"
        run: pytest tests/eval -q

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: golden-eval-report
          path: data/golden/last_eval_report.json

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          tags: tap-rag-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
